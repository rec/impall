[project]
name = "impall"
version = "1.5.3"
description = "🛎 Test-import all modules 🛎"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/rec/impall"
Repository = "https://github.com/rec/impall"
Documentation = "https://rec.github.io/impall"

[project.scripts]
impall = "impall:report"

[tool.doks]
auto = true

[dependency-groups]
dev = [
    "coverage",
    "pyfakefs",
    "pytest",
    "ruff",
    "pyupgrade>=3.21.2",
    "ty>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["impall"]

[tool.coverage.report]
fail_under = 69
skip_covered = true
exclude_lines = ["pragma: no cover", "if False:", "if __name__ == .__main__.:", "raise NotImplementedError"]


[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

